<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>#36 spike</title>
    <style>
      body {
        font: 16px/1.4 system-ui, sans-serif;
        margin: 1rem;
        max-width: 36rem;
      }
      button {
        font: inherit;
        padding: 0.6rem 1rem;
        margin: 0.25rem 0.25rem 0.25rem 0;
      }
      label {
        display: block;
        margin: 0.4rem 0;
      }
      pre {
        background: #eee;
        padding: 0.5rem;
        white-space: pre-wrap;
        font-size: 13px;
      }
    </style>
  </head>
  <body>
    <h1>#36 spike</h1>
    <p>
      Rain plays through one audio element with lock-screen controls, like the
      app. Everything iOS tells the page is logged below with the time.
    </p>

    <label
      ><input type="checkbox" id="opt-session" /> Set audio session to
      "playback"</label
    >
    <label
      ><input type="checkbox" id="opt-ctx" /> Also run a silent Web Audio
      context</label
    >
    <label
      ><input type="checkbox" id="opt-resume" /> Auto-resume after an unexpected
      pause (tries at 0.5, 1.5, 3, 6 s)</label
    >
    <button id="start">Start</button>
    <button id="stop">Stop</button>

    <p>Tap what you are about to do, then do it:</p>
    <button data-mark="noise cancelling change">NC change</button>
    <button data-mark="battery check">Battery</button>
    <button data-mark="other device connects">Device connects</button>
    <button data-mark="headphones off">Headphones off</button>
    <button data-mark="headphones on">Headphones on</button>

    <p>
      <button id="copy">Copy log</button>
      <button id="clear">Clear log</button>
      <span id="copied"></span>
    </p>
    <pre id="log"></pre>

    <script>
      const KEY = "spike36-log";
      const logEl = document.getElementById("log");
      let lines = JSON.parse(localStorage.getItem(KEY) || "[]");
      const stamp = () => {
        const d = new Date();
        return (
          d.toTimeString().slice(0, 8) +
          "." +
          String(d.getMilliseconds()).padStart(3, "0")
        );
      };
      function log(msg) {
        lines.push(stamp() + " " + msg);
        localStorage.setItem(KEY, JSON.stringify(lines));
        logEl.textContent = lines.slice().reverse().join("\n");
      }
      logEl.textContent = lines.slice().reverse().join("\n");
      log(
        "page loaded · " +
          navigator.userAgent.replace(/^.*?\(|\).*$/g, "").slice(0, 60),
      );

      const opt = (id) => document.getElementById(id).checked;
      const rain = new Audio("/longquiet/audio/rain.mp3");
      rain.loop = true;
      rain.preload = "none";
      let wanted = false;
      let ctx = null;
      let retries = [];

      const elState = () =>
        "paused=" +
        rain.paused +
        " t=" +
        rain.currentTime.toFixed(1) +
        " rs=" +
        rain.readyState +
        " ns=" +
        rain.networkState;
      const sessionState = () =>
        navigator.audioSession
          ? " session=" +
            navigator.audioSession.type +
            "/" +
            navigator.audioSession.state
          : "";
      const ctxState = () => (ctx ? " ctx=" + ctx.state : "");
      const snap = () => elState() + sessionState() + ctxState();

      [
        "play",
        "playing",
        "pause",
        "waiting",
        "stalled",
        "suspend",
        "emptied",
        "ended",
        "error",
        "ratechange",
        "volumechange",
      ].forEach((e) =>
        rain.addEventListener(e, () => {
          log("element " + e + " · " + snap() + (wanted ? "" : " (not wanted)"));
          if (e === "pause" && wanted && opt("opt-resume")) scheduleResume();
          if (e === "playing") cancelResume();
        }),
      );

      function cancelResume() {
        retries.forEach(clearTimeout);
        retries = [];
      }
      function scheduleResume() {
        cancelResume();
        [500, 1500, 3000, 6000].forEach((ms) =>
          retries.push(
            setTimeout(() => {
              if (!wanted || !rain.paused) return;
              rain.play().then(
                () => log("auto-resume at " + ms + " ms: resolved · " + snap()),
                (err) =>
                  log(
                    "auto-resume at " + ms + " ms: " + err.name + " · " + snap(),
                  ),
              );
            }, ms),
          ),
        );
      }

      if ("mediaSession" in navigator) {
        ["play", "pause", "stop", "nexttrack", "previoustrack", "seekto"].forEach(
          (a) => {
            try {
              navigator.mediaSession.setActionHandler(a, (d) => {
                log("lock-screen action " + a + " · " + snap());
                if (a === "play") {
                  wanted = true;
                  rain.play();
                } else if (a === "pause" || a === "stop") {
                  wanted = false;
                  cancelResume();
                  rain.pause();
                }
              });
            } catch (e) {
              log("action " + a + " unsupported");
            }
          },
        );
      }
      if (navigator.audioSession) {
        navigator.audioSession.onstatechange = () =>
          log("audioSession state · " + snap());
      } else log("navigator.audioSession unsupported");
      if (navigator.mediaDevices) {
        navigator.mediaDevices.ondevicechange = async () => {
          let kinds = "";
          try {
            const ds = await navigator.mediaDevices.enumerateDevices();
            kinds = ds.map((d) => d.kind).join(",");
          } catch (e) {
            kinds = e.name;
          }
          log("devicechange [" + kinds + "] · " + snap());
        };
      }
      document.addEventListener("visibilitychange", () =>
        log("visibility " + document.visibilityState + " · " + snap()),
      );
      ["pagehide", "pageshow", "freeze", "resume", "focus", "blur"].forEach((e) =>
        window.addEventListener(e, () => log("window " + e)),
      );

      document.getElementById("start").onclick = async () => {
        log("----");
        if (navigator.audioSession)
          navigator.audioSession.type = opt("opt-session") ? "playback" : "auto";
        if (opt("opt-ctx") && !ctx) {
          ctx = new AudioContext();
          const g = ctx.createGain();
          g.gain.value = 0;
          const o = ctx.createOscillator();
          o.connect(g).connect(ctx.destination);
          o.start();
          ctx.onstatechange = () => log("AudioContext state · " + snap());
        }
        if (ctx) ctx.resume();
        if ("mediaSession" in navigator) {
          navigator.mediaSession.metadata = new MediaMetadata({
            title: "Rain",
            artist: "#36 spike",
          });
          navigator.mediaSession.playbackState = "playing";
        }
        log(
          "start · options session=" +
            opt("opt-session") +
            " ctx=" +
            opt("opt-ctx") +
            " resume=" +
            opt("opt-resume"),
        );
        wanted = true;
        try {
          await rain.play();
        } catch (e) {
          log("play rejected " + e.name);
        }
      };
      document.getElementById("stop").onclick = () => {
        wanted = false;
        cancelResume();
        rain.pause();
        if ("mediaSession" in navigator)
          navigator.mediaSession.playbackState = "paused";
        log("stop pressed");
      };
      document.querySelectorAll("[data-mark]").forEach((b) => {
        b.onclick = () => log(">>> " + b.dataset.mark);
      });
      document.getElementById("copy").onclick = async () => {
        try {
          await navigator.clipboard.writeText(lines.join("\n"));
          document.getElementById("copied").textContent = "copied";
        } catch (e) {
          document.getElementById("copied").textContent =
            "copy failed: " + e.name;
        }
      };
      document.getElementById("clear").onclick = () => {
        lines = [];
        localStorage.removeItem(KEY);
        logEl.textContent = "";
      };
    </script>
  </body>
</html>
