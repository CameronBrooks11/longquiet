name: Suggest a feature
description: Something longquiet could do, or do better.
labels: ["enhancement"]
body:
  - type: textarea
    id: what
    attributes:
      label: What you'd like
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why
      description: When you'd use it, and what it would help with.
