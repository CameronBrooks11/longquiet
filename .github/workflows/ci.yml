# Branch protection requires only the `ok` job; it collects the others.
# Pull requests only: a squash merge of an up-to-date branch lands the tree the
# PR run already tested. No dependency cache, since without a run on main it
# would go cold within a week.

name: CI

on:
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: extractions/setup-just@v4
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - run: just setup
      - run: just check
      - run: just check-release
        env:
          GH_TOKEN: ${{ github.token }}
      - run: just test
      - run: just build

  # Browser smoke tests of the built site with the real audio release.
  e2e:
    name: E2E
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: extractions/setup-just@v4
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - run: just setup
      - run: npm exec -- playwright install --with-deps chromium firefox webkit
      - run: just fetch-audio
      - run: just build
      - run: just e2e
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  ok:
    name: ok
    if: always()
    needs: [check, e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail if any upstream job failed or was cancelled
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
      - run: echo 'All checks passed or were skipped'
