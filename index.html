<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta
      name="description"
      content="Real field recordings, openly licensed, for long hours of quiet."
    />
    <meta name="color-scheme" content="light dark" />
    <meta
      name="theme-color"
      content="#f3f1ec"
      media="(prefers-color-scheme: light)"
    />
    <meta
      name="theme-color"
      content="#14161a"
      media="(prefers-color-scheme: dark)"
    />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='12' fill='none' stroke='%237a8f7b' stroke-width='3'/%3E%3C/svg%3E"
    />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <title>longquiet.</title>
    <script type="module" src="/src/main.ts"></script>
  </head>
  <body>
    <main>
      <header>
        <h1>longquiet<span class="dot">.</span></h1>
        <p class="tagline">Real recordings. Open licences. Nothing to do.</p>
      </header>

      <div
        class="scapes"
        role="radiogroup"
        aria-label="Soundscape"
        id="scapes"
      ></div>

      <button class="play" id="play" type="button" aria-label="Play">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path class="icon-play" d="M8 5.5v13l11-6.5z" />
          <path class="icon-pause" d="M7 5h3.5v14H7zM13.5 5H17v14h-3.5z" />
        </svg>
      </button>

      <p class="now" id="now" aria-live="polite"></p>

      <label class="volume" id="volume-row">
        <span class="visually-hidden">Volume</span>
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z" />
        </svg>
        <input type="range" id="volume" min="0" max="1" step="0.01" />
      </label>
      <p class="hint" id="volume-hint" hidden>
        Use your device's volume buttons.
      </p>

      <details class="credits">
        <summary>Credits &amp; licences</summary>
        <ul id="credits"></ul>
        <p>
          Recordings are used under the licence listed for each. The app's code
          is
          <a href="https://github.com/CameronBrooks11/longquiet">open source</a>
          under the MIT licence.
        </p>
      </details>
    </main>
  </body>
</html>
